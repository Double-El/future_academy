<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수수료율 계산기</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.0/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #34495e;
            --accent-color: #3498db;
            --success-color: #2ecc71;
            --background-color: #f8f9fa;
            --card-background: #ffffff;
            --text-primary: #2c3e50;
            --text-secondary: #7f8c8d;
            --border-radius: 12px;
            --box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        body {
            font-family: 'Noto Sans KR', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--background-color);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: var(--card-background);
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
        }

        h1 {
            font-size: 2.5em;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 30px;
            text-align: center;
            position: relative;
            padding-bottom: 15px;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 3px;
            background: linear-gradient(to right, var(--accent-color), var(--success-color));
            border-radius: 3px;
        }

        .input-section {
            margin-bottom: 30px;
            padding: 30px;
            background-color: var(--card-background);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            transition: var(--transition);
        }

        .input-section:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        input[type="number"], textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: var(--border-radius);
            font-size: 1em;
            transition: var(--transition);
            box-sizing: border-box;
        }

        input[type="number"]:focus, textarea:focus {
            border-color: var(--accent-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--accent-color), var(--success-color));
            color: white;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: 500;
            transition: var(--transition);
            margin: 5px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.2);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .stat-card {
            background-color: var(--card-background);
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(to bottom, var(--accent-color), var(--success-color));
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
        }

        .stat-card h3 {
            margin: 0;
            color: var(--text-secondary);
            font-size: 0.9em;
            font-weight: 500;
        }

        .stat-card p {
            margin: 10px 0 0;
            font-size: 1.4em;
            font-weight: 700;
            color: var(--text-primary);
        }

        .chart-container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            margin-top: 30px;
        }

        .chart-wrapper {
            flex: 1;
            min-width: 300px;
            background-color: var(--card-background);
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            transition: var(--transition);
        }

        .chart-wrapper:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 30px;
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--box-shadow);
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background-color: var(--primary-color);
            color: white;
            font-weight: 500;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: rgba(52, 152, 219, 0.05);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .stat-card, .chart-wrapper, .input-section {
            animation: fadeIn 0.5s ease-out forwards;
        }

        .stat-card:nth-child(2) { animation-delay: 0.1s; }
        .stat-card:nth-child(3) { animation-delay: 0.2s; }
        .stat-card:nth-child(4) { animation-delay: 0.3s; }
        .stat-card:nth-child(5) { animation-delay: 0.4s; }
        .stat-card:nth-child(6) { animation-delay: 0.5s; }
    </style>
</head>
<body>
    <div class="container">
        <h1>수수료율 계산기</h1>
        
        <div class="input-section">
            <h2>데이터 입력</h2>
            <div class="input-group">
                <label>최대 수수료율 (%)</label>
                <input type="number" id="maxFeeRate" value="20" min="0" max="100" step="0.1">
            </div>
            <div class="input-group">
                <label>최소 수수료율 (%)</label>
                <input type="number" id="minFeeRate" value="6" min="0" max="100" step="0.1">
            </div>
            <div class="input-group">
                <label>거래 금액 (쉼표로 구분)</label>
                <textarea id="transactionAmounts" rows="5" placeholder="예: 1000000, 2000000, 3000000"></textarea>
            </div>
            <button onclick="calculateFees()">계산하기</button>
            <button onclick="downloadCSV()">CSV 다운로드</button>
        </div>

        <div class="stats" id="stats">
            <!-- Statistics will be inserted here -->
        </div>

        <div class="chart-container">
            <div class="chart-wrapper">
                <canvas id="feeRateChart"></canvas>
            </div>
            <div class="chart-wrapper">
                <canvas id="profitChart"></canvas>
            </div>
        </div>

        <div id="resultsTable">
            <!-- Results table will be inserted here -->
        </div>
    </div>

    <script>
        let feeData = [];
        let feeRateChart = null;
        let profitChart = null;

        function calculateFees() {
            const maxFeeRate = parseFloat(document.getElementById('maxFeeRate').value) / 100;
            const minFeeRate = parseFloat(document.getElementById('minFeeRate').value) / 100;
            const amounts = document.getElementById('transactionAmounts').value
                .split(',')
                .map(x => parseFloat(x.trim()))
                .filter(x => !isNaN(x));

            if (amounts.length === 0) {
                alert('거래 금액을 입력해주세요.');
                return;
            }

            // Calculate mean for sensitivity
            const meanTotal = amounts.reduce((a, b) => a + b, 0) / amounts.length;
            const sensitivity = 1 / meanTotal;

            // Calculate fees
            feeData = amounts.map(amount => {
                let feeRate = maxFeeRate * Math.exp(-sensitivity * amount);
                feeRate = Math.max(feeRate, minFeeRate);
                const profit = amount * feeRate;
                return {
                    amount: amount,
                    feeRate: feeRate,
                    profit: profit
                };
            });

            updateStats();
            updateCharts();
            updateTable();
        }

        function updateStats() {
            const stats = {
                meanFeeRate: feeData.reduce((sum, x) => sum + x.feeRate, 0) / feeData.length,
                minFeeRate: Math.min(...feeData.map(x => x.feeRate)),
                maxFeeRate: Math.max(...feeData.map(x => x.feeRate)),
                meanProfit: Math.floor(feeData.reduce((sum, x) => sum + x.profit, 0) / feeData.length),
                totalProfit: Math.floor(feeData.reduce((sum, x) => sum + x.profit, 0)),
                totalTransactions: feeData.length
            };

            document.getElementById('stats').innerHTML = `
                <div class="stat-card">
                    <h3>평균 수수료율</h3>
                    <p>${(stats.meanFeeRate * 100).toFixed(2)}%</p>
                </div>
                <div class="stat-card">
                    <h3>최소 수수료율</h3>
                    <p>${(stats.minFeeRate * 100).toFixed(2)}%</p>
                </div>
                <div class="stat-card">
                    <h3>최대 수수료율</h3>
                    <p>${(stats.maxFeeRate * 100).toFixed(2)}%</p>
                </div>
                <div class="stat-card">
                    <h3>평균 영업이익</h3>
                    <p>${stats.meanProfit.toLocaleString()}원</p>
                </div>
                <div class="stat-card">
                    <h3>총 영업이익</h3>
                    <p>${stats.totalProfit.toLocaleString()}원</p>
                </div>
                <div class="stat-card">
                    <h3>총 거래 건수</h3>
                    <p>${stats.totalTransactions}건</p>
                </div>
            `;
        }

        function updateCharts() {
            // Fee Rate Chart
            if (feeRateChart) feeRateChart.destroy();
            const feeRateCtx = document.getElementById('feeRateChart').getContext('2d');
            feeRateChart = new Chart(feeRateCtx, {
                type: 'scatter',
                data: {
                    datasets: [{
                        label: '수수료율',
                        data: feeData.map(x => ({
                            x: x.amount,
                            y: x.feeRate * 100
                        })),
                        backgroundColor: 'rgba(54, 162, 235, 0.5)'
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        title: {
                            display: true,
                            text: '거래 금액별 수수료율'
                        }
                    },
                    scales: {
                        x: {
                            title: {
                                display: true,
                                text: '거래 금액'
                            }
                        },
                        y: {
                            title: {
                                display: true,
                                text: '수수료율 (%)'
                            }
                        }
                    }
                }
            });

            // Profit Chart
            if (profitChart) profitChart.destroy();
            const profitCtx = document.getElementById('profitChart').getContext('2d');
            profitChart = new Chart(profitCtx, {
                type: 'bar',
                data: {
                    labels: feeData.map(x => x.amount.toLocaleString()),
                    datasets: [{
                        label: '예상 영업이익',
                        data: feeData.map(x => x.profit),
                        backgroundColor: 'rgba(75, 192, 192, 0.5)'
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        title: {
                            display: true,
                            text: '거래 금액별 예상 영업이익'
                        }
                    },
                    scales: {
                        y: {
                            title: {
                                display: true,
                                text: '영업이익 (원)'
                            }
                        }
                    }
                }
            });
        }

        function updateTable() {
            const table = `
                <table>
                    <thead>
                        <tr>
                            <th>거래 금액</th>
                            <th>수수료율</th>
                            <th>예상 영업이익</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${feeData.map(x => `
                            <tr>
                                <td>${x.amount.toLocaleString()}원</td>
                                <td>${(x.feeRate * 100).toFixed(2)}%</td>
                                <td>${x.profit.toLocaleString()}원</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            document.getElementById('resultsTable').innerHTML = table;
        }

        function downloadCSV() {
            if (feeData.length === 0) {
                alert('먼저 수수료를 계산해주세요.');
                return;
            }

            const csv = Papa.unparse({
                fields: ['거래금액', '수수료율', '예상영업이익'],
                data: feeData.map(x => [
                    x.amount,
                    (x.feeRate * 100).toFixed(2),
                    x.profit
                ])
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '수수료계산결과.csv';
            link.click();
        }
    </script>
</body>
</html>
