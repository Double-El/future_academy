<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=414, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Banker ChatBot</title>
  <!-- Professional Banker Theme -->
  <style>
    :root {
      --primary: #1a2636;
      --secondary: #22304a;
      --accent: #d4af37;
      --text: #f5f5f5;
      --input-bg: #2c3a4e;
      --chat-bg: #19202b;
      --session-bg: #232e41;
      --session-active: #d4af37;
      --session-inactive: #22304a;
      --border: #3a4a63;
      --font: 'Segoe UI', 'Roboto', Arial, sans-serif;
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: var(--primary);
      color: var(--text);
      font-family: var(--font);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    #app {
      display: flex;
      flex-direction: row;
      height: 100vh;
      max-width: 414px;
      margin: 0 auto;
      background: var(--primary);
      box-shadow: 0 0 20px #0008;
    }
    .sessions {
      width: 80px;
      background: var(--session-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0;
      border-right: 1px solid var(--border);
      gap: 10px;
    }
    .session {
      width: 60px;
      height: 60px;
      border-radius: 15px;
      background: var(--session-inactive);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.1em;
      cursor: pointer;
      border: 2px solid transparent;
      transition: background 0.2s, border 0.2s;
      position: relative;
    }
    .session.active {
      background: var(--session-active);
      color: var(--primary);
      border: 2px solid var(--accent);
    }
    .session .close {
      position: absolute;
      top: 2px;
      right: 6px;
      color: #fff8;
      font-size: 0.9em;
      cursor: pointer;
      display: none;
    }
    .session:hover .close {
      display: block;
    }
    .add-session {
      width: 60px;
      height: 60px;
      border-radius: 15px;
      background: var(--accent);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2em;
      cursor: pointer;
      margin-top: auto;
      margin-bottom: 10px;
      border: none;
    }
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--chat-bg);
      height: 100vh;
      max-width: 334px;
    }
    .chat-header {
      padding: 18px 20px 10px 20px;
      font-size: 1.3em;
      font-weight: 600;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
      letter-spacing: 1px;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: var(--chat-bg);
    }
    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 1em;
      line-height: 1.5;
      word-break: break-word;
      box-shadow: 0 2px 8px #0002;
    }
    .message.user {
      align-self: flex-end;
      background: var(--accent);
      color: var(--primary);
      border-bottom-right-radius: 4px;
    }
    .message.assistant {
      align-self: flex-start;
      background: var(--secondary);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }
    .chat-input {
      display: flex;
      padding: 12px 16px;
      background: var(--input-bg);
      border-top: 1px solid var(--border);
      gap: 8px;
    }
    .chat-input input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      font-size: 1em;
      background: #22304a;
      color: var(--text);
      outline: none;
    }
    .chat-input button {
      background: var(--accent);
      color: var(--primary);
      border: none;
      border-radius: 8px;
      padding: 0 18px;
      font-size: 1em;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .chat-input button:active {
      background: #bfa133;
    }
    @media (max-width: 414px) {
      #app {
        max-width: 100vw;
      }
      .chat-area {
        max-width: calc(100vw - 80px);
      }
    }
  </style>
</head>
<body>
  <!--
    WARNING: Never expose your OpenAI API key in production client-side code!
    This is for demo/testing only. In production, use a backend proxy.
  -->
  <div id="app">
    <div class="sessions" id="sessions"></div>
    <div class="chat-area">
      <div class="chat-header">Banker ChatBot</div>
      <div class="chat-messages" id="chat-messages"></div>
      <form class="chat-input" id="chat-form">
        <input type="text" id="chat-input" placeholder="Type your message..." autocomplete="off" required />
        <button type="submit">Send</button>
      </form>
    </div>
  </div>
  <script>
    // --- CONFIG ---
    // WARNING: Never expose your OpenAI API key in production!
    const OPENAI_API_KEY = "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";
    const OPENAI_API_URL = "https://api.openai.com/v1/chat/completions";
    const SYSTEM_PROMPT = "You are an AI that answers as concisely as possible.";
    // --- END CONFIG ---

    // --- State ---
    let sessions = [];
    let activeSession = 0;

    function createSession(name = "Chat") {
      return {
        name,
        messages: [
          { role: "system", content: SYSTEM_PROMPT }
        ]
      };
    }

    function renderSessions() {
      const sessionsDiv = document.getElementById('sessions');
      sessionsDiv.innerHTML = '';
      sessions.forEach((session, idx) => {
        const div = document.createElement('div');
        div.className = 'session' + (idx === activeSession ? ' active' : '');
        div.textContent = session.name;
        div.title = session.name;
        div.onclick = () => { activeSession = idx; renderSessions(); renderMessages(); };
        // Close button (except if only one session)
        if (sessions.length > 1) {
          const close = document.createElement('span');
          close.className = 'close';
          close.textContent = '×';
          close.onclick = (e) => {
            e.stopPropagation();
            sessions.splice(idx, 1);
            if (activeSession >= sessions.length) activeSession = sessions.length - 1;
            renderSessions();
            renderMessages();
          };
          div.appendChild(close);
        }
        sessionsDiv.appendChild(div);
      });
      // Add session button
      const add = document.createElement('div');
      add.className = 'add-session';
      add.textContent = '+';
      add.title = 'New Chat';
      add.onclick = () => {
        sessions.push(createSession('Chat ' + (sessions.length + 1)));
        activeSession = sessions.length - 1;
        renderSessions();
        renderMessages();
      };
      sessionsDiv.appendChild(add);
    }

    function renderMessages() {
      const chatDiv = document.getElementById('chat-messages');
      chatDiv.innerHTML = '';
      const msgs = sessions[activeSession].messages.filter(m => m.role !== 'system');
      msgs.forEach(msg => {
        const div = document.createElement('div');
        div.className = 'message ' + (msg.role === 'user' ? 'user' : 'assistant');
        div.textContent = msg.content;
        chatDiv.appendChild(div);
      });
      chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    async function sendMessage(text) {
      const session = sessions[activeSession];
      session.messages.push({ role: 'user', content: text });
      renderMessages();
      // Show loading message
      const chatDiv = document.getElementById('chat-messages');
      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'message assistant';
      loadingDiv.textContent = '...';
      chatDiv.appendChild(loadingDiv);
      chatDiv.scrollTop = chatDiv.scrollHeight;
      // Call OpenAI
      try {
        const response = await fetch(OPENAI_API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + OPENAI_API_KEY
          },
          body: JSON.stringify({
            model: 'gpt-4o',
            messages: session.messages
          })
        });
        const data = await response.json();
        if (data.choices && data.choices[0] && data.choices[0].message) {
          const reply = data.choices[0].message.content.trim();
          session.messages.push({ role: 'assistant', content: reply });
        } else {
          session.messages.push({ role: 'assistant', content: 'Sorry, no response.' });
        }
      } catch (e) {
        session.messages.push({ role: 'assistant', content: 'Error: ' + e.message });
      }
      renderMessages();
    }

    // --- Event Listeners ---
    document.getElementById('chat-form').onsubmit = function(e) {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      sendMessage(text);
    };

    // --- Init ---
    sessions = [createSession('Chat 1')];
    renderSessions();
    renderMessages();
  </script>
</body>
</html>
