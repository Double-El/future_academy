<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=414, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>신한 SOL 챗봇</title>
  <!-- 신한 SOL 스타일 -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --shinhan-blue: #0052A4;
      --shinhan-mint: #00C1D5;
      --shinhan-light: #F5F7FA;
      --shinhan-gray: #E5E8EB;
      --white: #fff;
      --text-main: #222;
      --text-sub: #666;
      --font: 'Noto Sans KR', 'Apple SD Gothic', 'sans-serif';
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: var(--shinhan-light);
      color: var(--text-main);
      font-family: var(--font);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    #app {
      display: flex;
      flex-direction: row;
      height: 100vh;
      max-width: 414px;
      margin: 0 auto;
      background: var(--shinhan-light);
      box-shadow: 0 0 20px #0001;
      border-radius: 18px 18px 0 0;
      border: 1px solid var(--shinhan-gray);
    }
    .sessions {
      width: 80px;
      background: var(--white);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0;
      border-right: 1px solid var(--shinhan-gray);
      gap: 10px;
    }
    .session {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: var(--shinhan-gray);
      color: var(--text-sub);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 500;
      font-size: 1em;
      cursor: pointer;
      border: 2px solid transparent;
      transition: background 0.2s, border 0.2s, color 0.2s;
      position: relative;
      margin-bottom: 2px;
    }
    .session.active {
      background: var(--shinhan-blue);
      color: var(--white);
      border: 2px solid var(--shinhan-mint);
      font-weight: 700;
    }
    .session .close {
      position: absolute;
      top: 2px;
      right: 6px;
      color: #888;
      font-size: 0.9em;
      cursor: pointer;
      display: none;
    }
    .session:hover .close {
      display: block;
    }
    .add-session {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: var(--shinhan-mint);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2em;
      cursor: pointer;
      margin-top: auto;
      margin-bottom: 10px;
      border: none;
      box-shadow: 0 2px 8px #00c1d522;
      transition: background 0.2s;
    }
    .add-session:active {
      background: #00b0c0;
    }
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--shinhan-light);
      height: 100vh;
      max-width: 334px;
      border-radius: 0 18px 0 0;
    }
    .chat-header {
      padding: 18px 20px 10px 20px;
      font-size: 1.3em;
      font-weight: 700;
      color: var(--shinhan-blue);
      border-bottom: 1px solid var(--shinhan-gray);
      letter-spacing: 1px;
      background: var(--white);
      border-radius: 0 18px 0 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .chat-header::before {
      content: '';
      display: inline-block;
      width: 28px;
      height: 28px;
      background: url('https://upload.wikimedia.org/wikipedia/commons/2/2e/Shinhan_Bank_logo.svg') no-repeat center/contain;
      vertical-align: middle;
      margin-right: 6px;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: var(--shinhan-light);
    }
    .message {
      max-width: 80%;
      padding: 13px 18px;
      border-radius: 18px;
      font-size: 1em;
      line-height: 1.6;
      word-break: break-word;
      box-shadow: 0 2px 8px #0001;
      border: 1px solid var(--shinhan-gray);
    }
    .message.user {
      align-self: flex-end;
      background: var(--shinhan-mint);
      color: var(--white);
      border-bottom-right-radius: 6px;
      border: 1.5px solid #b2f2f7;
      box-shadow: 0 2px 8px #00c1d522;
    }
    .message.assistant {
      align-self: flex-start;
      background: var(--white);
      color: var(--text-main);
      border-bottom-left-radius: 6px;
      border: 1.5px solid var(--shinhan-gray);
      box-shadow: 0 2px 8px #0052a422;
    }
    .chat-input {
      display: flex;
      padding: 12px 16px;
      background: var(--white);
      border-top: 1px solid var(--shinhan-gray);
      gap: 8px;
    }
    .chat-input input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1.5px solid var(--shinhan-gray);
      font-size: 1em;
      background: var(--shinhan-light);
      color: var(--text-main);
      outline: none;
      transition: border 0.2s;
    }
    .chat-input input:focus {
      border: 1.5px solid var(--shinhan-mint);
    }
    .chat-input button {
      background: var(--shinhan-blue);
      color: var(--white);
      border: none;
      border-radius: 12px;
      padding: 0 22px;
      font-size: 1em;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      box-shadow: 0 2px 8px #0052a422;
    }
    .chat-input button:active {
      background: #003b7a;
    }
    @media (max-width: 414px) {
      #app {
        max-width: 100vw;
      }
      .chat-area {
        max-width: calc(100vw - 80px);
      }
    }
  </style>
</head>
<body>
  <!--
    WARNING: Never expose your OpenAI API key in production client-side code!
    This is for demo/testing only. In production, use a backend proxy.
  -->
  <div id="app">
    <div class="sessions" id="sessions"></div>
    <div class="chat-area">
      <div class="chat-header">
        <button id="shinhan-logo-btn" style="background:none;border:none;padding:0;margin:0;cursor:pointer;outline:none;display:flex;align-items:center;">
          <img src="https://upload.wikimedia.org/wikipedia/commons/2/2e/Shinhan_Bank_logo.svg" alt="신한로고" style="width:28px;height:28px;vertical-align:middle;" />
        </button>
        <span style="margin-left:8px; font-weight:700; color:#0052A4; font-size:1.1em;">신한 SOL 챗봇</span>
      </div>
      <div class="chat-messages" id="chat-messages"></div>
      <form class="chat-input" id="chat-form">
        <input type="text" id="chat-input" placeholder="메시지를 입력하세요..." autocomplete="off" required />
        <button type="submit">전송</button>
      </form>
    </div>
  </div>
  <script>
    // --- CONFIG ---
    // WARNING: Never expose your OpenAI API key in production!
    const OPENAI_API_KEY = "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";
    const OPENAI_API_URL = "https://api.openai.com/v1/chat/completions";
    const SYSTEM_PROMPT = "당신은 신한은행의 대표 캐릭터 몰리입니다. 친근하고 따뜻한 말투로, 금융 전문가처럼 답변하세요. 답변은 항상 짧고 명확하게, '~예요', '~드릴게요!' 등 몰리 특유의 말투를 사용하세요.";
    // --- END CONFIG ---

    // --- State ---
    let sessions = [];
    let activeSession = 0;

    function createSession(name = "Chat") {
      return {
        name,
        messages: [
          { role: "system", content: SYSTEM_PROMPT }
        ]
      };
    }

    function renderSessions() {
      const sessionsDiv = document.getElementById('sessions');
      sessionsDiv.innerHTML = '';
      sessions.forEach((session, idx) => {
        const div = document.createElement('div');
        div.className = 'session' + (idx === activeSession ? ' active' : '');
        div.textContent = session.name;
        div.title = session.name;
        div.onclick = () => { activeSession = idx; renderSessions(); renderMessages(); };
        // Close button (except if only one session)
        if (sessions.length > 1) {
          const close = document.createElement('span');
          close.className = 'close';
          close.textContent = '×';
          close.onclick = (e) => {
            e.stopPropagation();
            sessions.splice(idx, 1);
            if (activeSession >= sessions.length) activeSession = sessions.length - 1;
            renderSessions();
            renderMessages();
          };
          div.appendChild(close);
        }
        sessionsDiv.appendChild(div);
      });
      // Add session button
      const add = document.createElement('div');
      add.className = 'add-session';
      add.textContent = '+';
      add.title = '새로운 채팅';
      add.onclick = () => {
        sessions.push(createSession('Chat ' + (sessions.length + 1)));
        activeSession = sessions.length - 1;
        renderSessions();
        renderMessages();
      };
      sessionsDiv.appendChild(add);
    }

    function renderMessages() {
      const chatDiv = document.getElementById('chat-messages');
      chatDiv.innerHTML = '';
      const msgs = sessions[activeSession].messages.filter(m => m.role !== 'system');
      msgs.forEach(msg => {
        const div = document.createElement('div');
        div.className = 'message ' + (msg.role === 'user' ? 'user' : 'assistant');
        div.textContent = msg.content;
        if (msg.role === 'assistant') {
          // 몰리 캐릭터와 이름 추가
          const mollyWrap = document.createElement('div');
          mollyWrap.style.display = 'flex';
          mollyWrap.style.alignItems = 'flex-start';
          mollyWrap.style.gap = '8px';

          // 몰리 프로필 이미지
          const mollyImg = document.createElement('img');
          mollyImg.src = 'https://shinhangroup.com/kr/about/identity/img/character_moli.png';
          mollyImg.alt = '몰리';
          mollyImg.style.width = '36px';
          mollyImg.style.height = '36px';
          mollyImg.style.borderRadius = '50%';
          mollyImg.style.background = '#fff';
          mollyImg.style.border = '1.5px solid #E5E8EB';
          mollyImg.style.marginTop = '2px';

          // 말풍선+이름
          const msgWrap = document.createElement('div');
          msgWrap.style.display = 'flex';
          msgWrap.style.flexDirection = 'column';
          msgWrap.style.alignItems = 'flex-start';

          // 이름
          const name = document.createElement('div');
          name.textContent = '몰리';
          name.style.fontSize = '0.92em';
          name.style.fontWeight = '700';
          name.style.color = '#0052A4';
          name.style.marginBottom = '2px';
          name.style.marginLeft = '2px';

          msgWrap.appendChild(name);
          msgWrap.appendChild(div);

          mollyWrap.appendChild(mollyImg);
          mollyWrap.appendChild(msgWrap);
          chatDiv.appendChild(mollyWrap);
        } else {
          chatDiv.appendChild(div);
        }
      });
      chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    async function sendMessage(text) {
      const session = sessions[activeSession];
      session.messages.push({ role: 'user', content: text });
      renderMessages();
      // Show loading message
      const chatDiv = document.getElementById('chat-messages');
      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'message assistant';
      loadingDiv.textContent = '...';
      chatDiv.appendChild(loadingDiv);
      chatDiv.scrollTop = chatDiv.scrollHeight;
      // Call OpenAI
      try {
        const response = await fetch(OPENAI_API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + OPENAI_API_KEY
          },
          body: JSON.stringify({
            model: 'gpt-4o',
            messages: session.messages
          })
        });
        const data = await response.json();
        if (data.choices && data.choices[0] && data.choices[0].message) {
          const reply = data.choices[0].message.content.trim();
          session.messages.push({ role: 'assistant', content: reply });
        } else {
          session.messages.push({ role: 'assistant', content: '다시 말씀해주세요.' });
        }
      } catch (e) {
        session.messages.push({ role: 'assistant', content: 'Error: ' + e.message });
      }
      renderMessages();
    }

    // --- Event Listeners ---
    document.getElementById('chat-form').onsubmit = function(e) {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      sendMessage(text);
    };

    // --- Init ---
    sessions = [createSession('Chat 1')];
    renderSessions();
    renderMessages();
    // 신한로고 버튼 클릭 시 sending_money.html로 이동
    document.getElementById('shinhan-logo-btn').onclick = function() {
      window.location.href = 'sending_money.html';
    };
  </script>
</body>
</html>
