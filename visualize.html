<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>프로젝트 목표 - soomk 특성요인도</title>
  <style>
    body {
      font-family: 'Noto Sans KR', Arial, sans-serif;
      background: #f8f9fa;
      margin: 0;
      padding: 40px;
    }
    .container {
      max-width: 900px;
      margin: auto;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      padding: 32px;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 0.5em;
    }
    .subtitle {
      color: #6c757d;
      font-size: 1.1rem;
      margin-bottom: 2em;
    }
    details {
      margin-bottom: 1.5em;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      background: #f4f7fa;
      padding: 1em;
      transition: box-shadow 0.2s;
    }
    details[open] {
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      background: #eaf3fa;
    }
    summary {
      font-weight: bold;
      font-size: 1.2rem;
      cursor: pointer;
      outline: none;
    }
    ul {
      margin-top: 0.7em;
      margin-bottom: 0;
      padding-left: 1.5em;
    }
    .arrow {
      font-size: 2rem;
      color: #6c757d;
      margin: 0 1em;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>프로젝트 목표</h1>
    <div class="subtitle"><b>soomk</b> 특성요인도</div>
    
    <details>
      <summary>의뢰자 이탈</summary>
      <ul>
        <li>전문가 비교의 피로감</li>
        <li>과도한 추가 금액 유도</li>
        <li>개발 지식 부족</li>
        <li>적정 가격의 부재</li>
      </ul>
    </details>
    <span class="arrow">&#8594;</span>
    <details>
      <summary>전문가 이탈</summary>
      <ul>
        <li>불분명한 수수료율 기준</li>
        <li>악성 고객 관리 불만</li>
        <li>신규 전문가가 성장하기 어려운 구조</li>
        <li>서비스 가격 책정 어려움</li>
      </ul>
    </details>
    <span class="arrow">&#8594;</span>
    <details>
      <summary>정체된 거래성사율</summary>
      <ul>
        <li>경쟁사로의 고객 이탈</li>
        <li>거래 취소 횟수 증가</li>
        <li>불규칙한 거래 성사 횟수</li>
        <li>개인적인 거래 시도</li>
      </ul>
    </details>
  </div>
</body>
</html>
