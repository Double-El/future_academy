<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draggable Memos</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            overflow: hidden;
        }

        .memo {
            position: absolute;
            width: 200px;
            min-height: 150px;
            padding: 15px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            user-select: none;
            background-color: #ffd700;
        }

        .memo:hover {
            box-shadow: 3px 3px 8px rgba(0,0,0,0.3);
        }

        .memo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid rgba(0,0,0,0.2);
            cursor: move;
        }

        .memo-title {
            flex-grow: 1;
            margin-right: 10px;
            outline: none;
            font-weight: bold;
            cursor: text;
        }

        .memo-content {
            min-height: 100px;
            outline: none;
            width: 100%;
            box-sizing: border-box;
            cursor: text;
        }

        .delete-btn {
            cursor: pointer;
            color: #ff0000;
            font-weight: bold;
            padding: 0 5px;
        }

        .resize-handle {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 20px;
            height: 20px;
            cursor: nwse-resize;
            background: linear-gradient(135deg, transparent 50%, rgba(0,0,0,0.1) 50%);
        }

        .resize-handle:hover {
            background: linear-gradient(135deg, transparent 50%, rgba(0,0,0,0.2) 50%);
        }

        #add-memo {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            z-index: 1000;
        }

        #add-memo:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <button id="add-memo">Add New Memo</button>

    <script>
        let memoCount = 0;
        
        const memoColors = [
            '#FFB3BA', // Pastel Pink
            '#BAFFC9', // Pastel Green
            '#BAE1FF', // Pastel Blue
            '#FFFFBA', // Pastel Yellow
            '#FFE4BA', // Pastel Orange
            '#E8BAFF', // Pastel Purple
            '#BAFFE4', // Pastel Mint
            '#FFD1DC', // Light Pink
            '#B5EAD7', // Mint Green
            '#C7CEEA'  // Light Blue
        ];

        function saveMemos() {
            const memos = [];
            document.querySelectorAll('.memo').forEach(memo => {
                memos.push({
                    id: memo.dataset.id,
                    title: memo.querySelector('.memo-title').textContent,
                    content: memo.querySelector('.memo-content').textContent,
                    left: memo.offsetLeft,
                    top: memo.offsetTop,
                    width: memo.offsetWidth,
                    height: memo.offsetHeight,
                    backgroundColor: memo.style.backgroundColor
                });
            });
            localStorage.setItem('memos', JSON.stringify(memos));
        }

        function loadMemos() {
            const savedMemos = JSON.parse(localStorage.getItem('memos') || '[]');
            memoCount = savedMemos.length;
            
            savedMemos.forEach(memoData => {
                const memo = document.createElement('div');
                memo.className = 'memo';
                memo.dataset.id = memoData.id;
                memo.style.left = memoData.left + 'px';
                memo.style.top = memoData.top + 'px';
                memo.style.width = memoData.width + 'px';
                memo.style.height = memoData.height + 'px';
                memo.style.backgroundColor = memoData.backgroundColor;
                
                memo.innerHTML = `
                    <div class="memo-header">
                        <div class="memo-title" contenteditable="true">${memoData.title}</div>
                        <span class="delete-btn" onclick="this.parentElement.parentElement.remove(); saveMemos();">×</span>
                    </div>
                    <div class="memo-content" contenteditable="true">${memoData.content}</div>
                    <div class="resize-handle"></div>
                `;

                document.body.appendChild(memo);
                makeDraggable(memo);
                makeResizable(memo);
            });
        }

        function createMemo() {
            const memo = document.createElement('div');
            memo.className = 'memo';
            memo.dataset.id = Date.now();
            const randomColor = memoColors[Math.floor(Math.random() * memoColors.length)];
            memo.style.backgroundColor = randomColor;
            memo.style.left = Math.random() * (window.innerWidth - 250) + 'px';
            memo.style.top = Math.random() * (window.innerHeight - 200) + 'px';
            
            memo.innerHTML = `
                <div class="memo-header">
                    <div class="memo-title" contenteditable="true">Memo ${++memoCount}</div>
                    <span class="delete-btn" onclick="this.parentElement.parentElement.remove(); saveMemos();">×</span>
                </div>
                <div class="memo-content" contenteditable="true"></div>
                <div class="resize-handle"></div>
            `;

            document.body.appendChild(memo);
            makeDraggable(memo);
            makeResizable(memo);
            saveMemos();
        }

        function makeDraggable(element) {
            const header = element.querySelector('.memo-header');
            let isDragging = false;
            let startX, startY, initialLeft, initialTop;

            header.addEventListener('mousedown', dragStart);
            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', dragEnd);

            function dragStart(e) {
                if (e.target.classList.contains('memo-title') || 
                    e.target.classList.contains('delete-btn')) {
                    return;
                }

                isDragging = true;
                startX = e.pageX;
                startY = e.pageY;
                initialLeft = element.offsetLeft;
                initialTop = element.offsetTop;
            }

            function drag(e) {
                if (!isDragging) return;
                
                e.preventDefault();
                const dx = e.pageX - startX;
                const dy = e.pageY - startY;
                
                let newLeft = initialLeft + dx;
                let newTop = initialTop + dy;

                // Keep memo within window bounds
                newLeft = Math.max(0, Math.min(newLeft, window.innerWidth - element.offsetWidth));
                newTop = Math.max(0, Math.min(newTop, window.innerHeight - element.offsetHeight));

                element.style.left = newLeft + 'px';
                element.style.top = newTop + 'px';
            }

            function dragEnd() {
                if (isDragging) {
                    isDragging = false;
                    saveMemos();
                }
            }
        }

        function makeResizable(element) {
            const resizeHandle = element.querySelector('.resize-handle');
            let isResizing = false;
            let startX, startY, startWidth, startHeight;

            resizeHandle.addEventListener('mousedown', initResize);
            document.addEventListener('mousemove', resize);
            document.addEventListener('mouseup', stopResize);

            function initResize(e) {
                isResizing = true;
                startX = e.pageX;
                startY = e.pageY;
                startWidth = element.offsetWidth;
                startHeight = element.offsetHeight;
                e.preventDefault();
            }

            function resize(e) {
                if (!isResizing) return;

                const width = startWidth + (e.pageX - startX);
                const height = startHeight + (e.pageY - startY);

                if (width > 150) {
                    element.style.width = width + 'px';
                }
                if (height > 100) {
                    element.style.height = height + 'px';
                }
            }

            function stopResize() {
                if (isResizing) {
                    isResizing = false;
                    saveMemos();
                }
            }
        }

        // Add event listeners for content changes
        document.addEventListener('input', function(e) {
            if (e.target.classList.contains('memo-title') || e.target.classList.contains('memo-content')) {
                saveMemos();
            }
        });

        document.getElementById('add-memo').addEventListener('click', createMemo);

        // Load saved memos when the page loads
        loadMemos();
    </script>
</body>
</html>
